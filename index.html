<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Blacksmith Simulator</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <style>
      html, body { margin: 0; height: 100%; background: #1a1210; display: flex; align-items: center; justify-content: center; }
      /* 1280x720 canvas, shrunk to fit smaller windows while keeping its 16:9 shape */
      canvas { width: min(1280px, 100vw, 177.78vh); height: auto; aspect-ratio: 16 / 9; border-radius: 8px; box-shadow: 0 0 40px #000; }
    </style>
  </head>
  <body>
    <canvas id="game" width="1280" height="720"></canvas>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
